<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Strava Tracker{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>
<body>
    <nav class="navbar is-dark" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item has-text-weight-bold" href="/">
                Strava Tracker
            </a>
            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="mainNav">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>
        <div id="mainNav" class="navbar-menu">
            <div class="navbar-start">
                <a class="navbar-item" href="/">Dashboard</a>
                <a class="navbar-item" href="/trends">Trends</a>
                <a class="navbar-item" href="/upload">Upload FIT</a>
                <a class="navbar-item" href="/settings">Settings</a>
            </div>
            <div class="navbar-end">
                <div class="navbar-item">
                    <button id="theme-toggle" class="button is-small is-ghost has-text-white" title="Toggle dark/light mode">
                        <span id="theme-icon">&#9790;</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            {% if flash %}
            <div class="notification is-info is-light">
                <button class="delete" onclick="this.parentElement.remove()"></button>
                {{ flash }}
            </div>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </section>

    <script>
    // Bulma navbar burger toggle
    document.addEventListener('DOMContentLoaded', () => {
        const burger = document.querySelector('.navbar-burger');
        if (burger) {
            burger.addEventListener('click', () => {
                const target = document.getElementById(burger.dataset.target);
                burger.classList.toggle('is-active');
                target.classList.toggle('is-active');
            });
        }
    });

    // Dark/light theme toggle
    (() => {
        const html = document.documentElement;
        const icon = document.getElementById('theme-icon');
        const saved = localStorage.getItem('theme');
        const theme = saved || 'dark';
        html.setAttribute('data-theme', theme);
        icon.textContent = theme === 'dark' ? '\u263E' : '\u2600';

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            icon.textContent = next === 'dark' ? '\u263E' : '\u2600';
        });
    })();
    </script>
</body>
</html>
