{% extends "base.html" %}

{% block title %}Upload FIT File - Streben{% endblock %}

{% block content %}
<h1 class="title">Upload FIT File</h1>
<p class="subtitle">Upload a .fit file from your Garmin or other cycling computer</p>

<div class="box">
    <form method="post" action="/upload" enctype="multipart/form-data">
        <div class="field">
            <div class="file has-name is-fullwidth is-boxed is-primary">
                <label class="file-label">
                    <input class="file-input" type="file" name="file" accept=".fit" id="fitFile">
                    <span class="file-cta">
                        <span class="file-label">Choose a .fit file…</span>
                    </span>
                    <span class="file-name" id="fileName">No file selected</span>
                </label>
            </div>
        </div>
        <div class="field">
            <button class="button is-primary is-medium" type="submit">Upload & Parse</button>
        </div>
    </form>
</div>

<script>
document.getElementById('fitFile').addEventListener('change', function() {
    document.getElementById('fileName').textContent =
        this.files.length ? this.files[0].name : 'No file selected';
});
</script>
{% endblock %}
