{% extends "base.html" %}

{% block title %}Trends - Streben{% endblock %}

{% block content %}
<h1 class="title">Trends</h1>

<div class="level">
    <div class="level-left">
        <div class="level-item">
            <div class="buttons has-addons" id="range-buttons">
                <button class="button is-small" data-range="1w">1W</button>
                <button class="button is-small" data-range="1m">1M</button>
                <button class="button is-small" data-range="3m">3M</button>
                <button class="button is-small is-info is-selected" data-range="6m">6M</button>
                <button class="button is-small" data-range="1y">1Y</button>
                <button class="button is-small" data-range="all">All</button>
            </div>
        </div>
    </div>
    <div class="level-right">
        <div class="level-item">
            <div class="buttons has-addons" id="metric-buttons">
                <button class="button is-small is-info is-selected" data-metric="duration">Duration</button>
                <button class="button is-small" data-metric="distance">Distance</button>
                <button class="button is-small" data-metric="elevation">Elevation</button>
                <button class="button is-small" data-metric="avg_power">Avg Power</button>
                <button class="button is-small" data-metric="max_power">Max Power</button>
                <button class="button is-small" data-metric="avg_hr">Avg HR</button>
                <button class="button is-small" data-metric="max_hr">Max HR</button>
                <button class="button is-small" data-metric="energy">Energy</button>
                <button class="button is-small" data-metric="suffer_score">Suffer Score</button>
                <button class="button is-small" data-metric="energy_balance">Energy Balance</button>
                <button class="button is-small" data-metric="weight">Weight</button>
            </div>
        </div>
        <div class="level-item ml-4">
            <label class="checkbox">
                <input type="checkbox" id="trend-toggle"> Trend line
            </label>
        </div>
    </div>
</div>

<div class="box">
    <div class="level mb-4" id="trend-stats"></div>
    <div id="chart" style="width: 100%; height: 450px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
(() => {
    const chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
    const metricConfig = {
        duration:  { name: 'Duration',  unit: 'min', color: '#3273dc', summable: true,  decimals: 1 },
        distance:  { name: 'Distance',  unit: 'mi',  color: '#23d160', summable: true,  decimals: 1 },
        elevation: { name: 'Elevation', unit: 'ft',  color: '#8B4513', summable: true,  decimals: 0 },
        avg_power: { name: 'Avg Power', unit: 'W',   color: '#ffdd57', summable: false, decimals: 0 },
        max_power: { name: 'Max Power', unit: 'W',   color: '#ff9f43', summable: false, decimals: 0 },
        avg_hr:    { name: 'Avg HR',    unit: 'bpm', color: '#ff3860', summable: false, decimals: 0 },
        max_hr:    { name: 'Max HR',    unit: 'bpm', color: '#cc2952', summable: false, decimals: 0 },
        energy:       { name: 'Energy',       unit: 'kJ',  color: '#00d1b2', summable: true, decimals: 0 },
        suffer_score: { name: 'Suffer Score', unit: '',    color: '#b86bff', summable: true, decimals: 0 },
        // kind: 'nutrition' metrics come from /api/nutrition-trends, which has a
        // dense one-row-per-calendar-day grain instead of one row per activity.
        energy_balance: { name: 'Energy Balance', unit: 'kcal', color: '#23d160', kind: 'nutrition' },
        weight:         { name: 'Weight', unit: 'lb', color: '#ff9f43', kind: 'nutrition',
                          summable: false, decimals: 1 },
    };

    let currentRange = '6m';
    let currentMetric = 'duration';
    let showTrend = false;
    let chartData = null;
    let nutritionData = null;

    function linearRegression(values) {
        const pts = [];
        for (let i = 0; i < values.length; i++) {
            if (values[i] != null) pts.push({ x: i, y: values[i] });
        }
        if (pts.length < 2) return null;
        const n = pts.length;
        const sx = pts.reduce((s, p) => s + p.x, 0);
        const sy = pts.reduce((s, p) => s + p.y, 0);
        const sxy = pts.reduce((s, p) => s + p.x * p.y, 0);
        const sxx = pts.reduce((s, p) => s + p.x * p.x, 0);
        const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx);
        const intercept = (sy - slope * sx) / n;
        return values.map((_, i) => Math.round((slope * i + intercept) * 100) / 100);
    }

    function computeStats(values) {
        const v = values.filter(x => x != null && Number.isFinite(x));
        const n = v.length;
        if (n === 0) return null;
        let sum = 0, min = v[0], max = v[0];
        for (const x of v) {
            sum += x;
            if (x < min) min = x;
            if (x > max) max = x;
        }
        const mean = sum / n;
        let stdDev = null;
        if (n > 1) {
            const variance = v.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1);
            stdDev = Math.sqrt(variance);
        }
        return { n, sum, min, max, mean, stdDev };
    }

    function renderStats() {
        const el = document.getElementById('trend-stats');
        const cfg = metricConfig[currentMetric];
        const stats = chartData ? computeStats(chartData[currentMetric]) : null;
        const fmt = (x, d = cfg.decimals) => x == null ? '—' : Number(x.toFixed(d)).toLocaleString() + (cfg.unit ? ' ' + cfg.unit : '');
        const tiles = [
            { label: 'Count', value: stats ? stats.n.toLocaleString() : '—' },
        ];
        if (cfg.summable) {
            tiles.push({ label: 'Sum', value: stats ? fmt(stats.sum) : '—' });
        }
        tiles.push(
            { label: 'Mean', value: stats ? fmt(stats.mean) : '—' },
            { label: 'Min', value: stats ? fmt(stats.min) : '—' },
            { label: 'Max', value: stats ? fmt(stats.max) : '—' },
            { label: 'StdDev', value: (stats && stats.stdDev != null) ? fmt(stats.stdDev, Math.max(cfg.decimals, 1)) : '—' },
        );
        el.innerHTML = tiles.map(t => `
            <div class="level-item has-text-centered">
                <div>
                    <p class="heading">${t.label}</p>
                    <p class="title is-4">${t.value}</p>
                </div>
            </div>`).join('');
    }

    function render() {
        const cfg = metricConfig[currentMetric];
        const isNutrition = cfg.kind === 'nutrition';
        // A linear regression across stacked balance bars is meaningless.
        document.getElementById('trend-toggle').closest('.level-item').style.display =
            isNutrition ? 'none' : '';
        chart.setOption(isNutrition ? buildNutritionOption() : buildOption(), true);
        isNutrition ? renderNutritionStats() : renderStats();
    }

    function buildOption() {
        if (!chartData) return {};
        const cfg = metricConfig[currentMetric];
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const series = [{
            name: cfg.name,
            type: 'line',
            data: chartData[currentMetric],
            showSymbol: chartData.dates.length < 60,
            smooth: true,
            lineStyle: { color: cfg.color, width: 2 },
            itemStyle: { color: cfg.color },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: cfg.color + '40' },
                { offset: 1, color: cfg.color + '05' },
            ])},
        }];
        if (showTrend) {
            const trendData = linearRegression(chartData[currentMetric]);
            if (trendData) {
                series.push({
                    name: 'Trend',
                    type: 'line',
                    data: trendData,
                    showSymbol: false,
                    lineStyle: { color: isDark ? '#aaa' : '#888', width: 2, type: 'dashed' },
                    itemStyle: { color: isDark ? '#aaa' : '#888' },
                });
            }
        }
        return {
            tooltip: {
                trigger: 'axis',
                formatter: params => {
                    let out = params[0].name;
                    for (const p of params) {
                        out += '<br>' + p.seriesName + ': ' + (p.value != null ? p.value + ' ' + cfg.unit : 'N/A');
                    }
                    return out;
                },
            },
            xAxis: {
                type: 'category',
                data: chartData.dates,
                axisLabel: { color: isDark ? '#ccc' : '#666' },
            },
            yAxis: {
                type: 'value',
                name: cfg.name + ' (' + cfg.unit + ')',
                nameTextStyle: { color: isDark ? '#ccc' : '#666' },
                axisLabel: { color: isDark ? '#ccc' : '#666' },
                splitLine: { lineStyle: { color: isDark ? '#444' : '#e0e0e0' } },
            },
            series,
            backgroundColor: 'transparent',
            grid: { left: 60, right: 20, top: 40, bottom: 40 },
        };
    }

    function buildNutritionOption() {
        const n = nutritionData;
        if (!n || !n.dates || !n.dates.length) return {};
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const axis = isDark ? '#ccc' : '#666';
        const split = { lineStyle: { color: isDark ? '#444' : '#e0e0e0' } };

        if (currentMetric === 'weight') {
            return {
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: n.dates, axisLabel: { color: axis } },
                yAxis: { type: 'value', name: 'Weight (lb)', scale: true,
                         nameTextStyle: { color: axis }, axisLabel: { color: axis }, splitLine: split },
                series: [{ name: 'Weight', type: 'line', data: n.weight_lb, smooth: true,
                           connectNulls: true, showSymbol: n.dates.length < 60,
                           lineStyle: { color: '#ff9f43', width: 2 }, itemStyle: { color: '#ff9f43' } }],
                backgroundColor: 'transparent',
                grid: { left: 60, right: 20, top: 40, bottom: 40 },
            };
        }

        // Shade the days with no food log so a gap reads as "no data" rather
        // than "ate nothing".
        const gaps = [];
        for (let i = 0; i < n.dates.length; i++) {
            if (!n.is_logged[i]) gaps.push([{ xAxis: n.dates[i] }, { xAxis: n.dates[i] }]);
        }

        return {
            tooltip: {
                trigger: 'axis',
                formatter: params => {
                    const i = params[0].dataIndex;
                    let out = params[0].name;
                    if (!n.is_logged[i]) out += ' <em>(not logged)</em>';
                    for (const p of params) {
                        if (p.value == null) continue;
                        // Never Math.abs() here: the cumulative balance is
                        // signed, and stripping the sign turns a deficit into
                        // an apparent surplus.
                        const v = Math.round(p.value);
                        const signed = p.seriesName === 'Cumulative Balance';
                        let line = p.seriesName + ': '
                            + (signed && v > 0 ? '+' : '') + v.toLocaleString() + ' kcal';
                        if (p.seriesName === 'On-Bike (est.)') {
                            line += ' &mdash; estimated from ride time';
                        }
                        if (signed) {
                            line += v < 0 ? ' (deficit)' : ' (surplus)';
                        }
                        out += '<br>' + p.marker + line;
                    }
                    return out;
                },
            },
            legend: { top: 0, textStyle: { color: axis } },
            xAxis: { type: 'category', data: n.dates, axisLabel: { color: axis } },
            yAxis: [
                { type: 'value', name: 'kcal/day', nameTextStyle: { color: axis },
                  axisLabel: { color: axis }, splitLine: split },
                { type: 'value', name: 'Cumulative', position: 'right',
                  nameTextStyle: { color: axis }, axisLabel: { color: axis },
                  splitLine: { show: false } },
            ],
            series: [
                { name: 'Logged Intake', type: 'bar', stack: 'in', data: n.intake_logged,
                  itemStyle: { color: '#23d160' },
                  markArea: gaps.length ? {
                      silent: true,
                      itemStyle: { color: isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.04)' },
                      data: gaps,
                  } : undefined },
                // Three redundant cues -- opacity, dashed border, hatch -- so this
                // never reads as logged data.
                { name: 'On-Bike (est.)', type: 'bar', stack: 'in', data: n.intake_onbike_est,
                  itemStyle: { color: '#23d160', opacity: 0.45,
                               borderColor: '#23d160', borderWidth: 1, borderType: 'dashed',
                               decal: { symbol: 'rect', dashArrayX: [1, 0], dashArrayY: [2, 5],
                                        rotation: -Math.PI / 4, color: 'rgba(255,255,255,.35)' } } },
                { name: 'Baseline', type: 'bar', stack: 'out', data: n.baseline_tdee,
                  itemStyle: { color: '#ff3860' } },
                { name: 'Ride Expenditure', type: 'bar', stack: 'out', data: n.ride_kcal,
                  itemStyle: { color: '#ff9f43' } },
                { name: 'Cumulative Balance', type: 'line', yAxisIndex: 1,
                  data: n.cumulative_balance, showSymbol: false,
                  lineStyle: { color: '#b86bff', width: 3 }, itemStyle: { color: '#b86bff' } },
            ],
            backgroundColor: 'transparent',
            grid: { left: 60, right: 60, top: 40, bottom: 40 },
        };
    }

    function renderNutritionStats() {
        const el = document.getElementById('trend-stats');
        const n = nutritionData;
        if (!n || !n.summary) { el.innerHTML = ''; return; }
        const num = x => x == null ? '\u2014' : Math.round(x).toLocaleString();
        let tiles;
        if (currentMetric === 'weight') {
            const w = (n.weight_lb || []).filter(x => x != null);
            const delta = w.length > 1 ? w[w.length - 1] - w[0] : null;
            tiles = [
                { label: 'Latest', value: w.length ? w[w.length - 1].toFixed(1) + ' lb' : '\u2014' },
                { label: 'Change', value: delta == null ? '\u2014' : (delta > 0 ? '+' : '') + delta.toFixed(1) + ' lb' },
                { label: 'Entries', value: w.length },
            ];
        } else {
            const s = n.summary;
            const sign = x => x == null ? '\u2014' : (x > 0 ? '+' : '') + num(x);
            tiles = [
                { label: 'Logged Days', value: s.logged_days },
                { label: 'Total Balance', value: sign(s.total_balance) + ' kcal' },
                { label: 'Mean / Day', value: sign(s.mean_balance) + ' kcal' },
                { label: 'Est. Weight Change',
                  value: s.total_balance == null ? '\u2014'
                         : (s.total_balance / 3500).toFixed(1) + ' lb' },
            ];
        }
        el.innerHTML = tiles.map(t => `
            <div class="level-item has-text-centered">
                <div>
                    <p class="heading">${t.label}</p>
                    <p class="title is-4">${t.value}</p>
                </div>
            </div>`).join('');
    }

    async function fetchData() {
        // Both endpoints are fetched together because a metric switch only
        // re-renders -- it must never need a network round trip.
        const [a, n] = await Promise.all([
            fetch('/api/trends?range=' + currentRange).then(r => r.json()),
            fetch('/api/nutrition-trends?range=' + currentRange).then(r => r.json()),
        ]);
        chartData = a;
        nutritionData = n;
        render();
    }

    // Range buttons
    document.getElementById('range-buttons').addEventListener('click', e => {
        const btn = e.target.closest('[data-range]');
        if (!btn) return;
        document.querySelectorAll('#range-buttons .button').forEach(b => b.classList.remove('is-info', 'is-selected'));
        btn.classList.add('is-info', 'is-selected');
        currentRange = btn.dataset.range;
        fetchData();
    });

    // Metric buttons
    document.getElementById('metric-buttons').addEventListener('click', e => {
        const btn = e.target.closest('[data-metric]');
        if (!btn) return;
        document.querySelectorAll('#metric-buttons .button').forEach(b => b.classList.remove('is-info', 'is-selected'));
        btn.classList.add('is-info', 'is-selected');
        currentMetric = btn.dataset.metric;
        render();
    });

    // Trend line toggle
    document.getElementById('trend-toggle').addEventListener('change', e => {
        showTrend = e.target.checked;
        render();
    });

    // Resize
    window.addEventListener('resize', () => chart.resize());

    // React to theme changes
    const observer = new MutationObserver(() => render());
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    fetchData();
})();
</script>
{% endblock %}
