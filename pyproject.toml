[project]
name = "strava-api-thing"
version = "0.1.0"
description = "Jupyter notebook-based project for exploring Strava cycling activity API and analyzing FIT files"
requires-python = ">=3.11"
authors = [
    {name = "Brad Montgomery"}
]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "arrow>=1.3.0",
    "certifi>=2024.0.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "seaborn>=0.13.0",
    "fitdecode>=0.10.0",
    "garmin-fit-sdk>=21.133.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipython>=8.15.0",
    "ipykernel>=6.26.0",
    "matplotlib-inline>=0.1.6",
]
