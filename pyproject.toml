[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strava-api-thing"
version = "0.1.0"
description = "Jupyter notebook-based project for exploring Strava cycling activity API and analyzing FIT files"
requires-python = ">=3.11"
authors = [
    {name = "Brad Montgomery"}
]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "arrow==1.2.3",
    "certifi==2022.12.7",
    "pandas==1.5.3",
    "Pillow==9.4.0",
    "plotly==5.13.0",
    "requests==2.28.2",
    "seaborn==0.12.2",
    "fitdecode==0.10.0",
    "garmin-fit-sdk==21.133.0",
    "matplotlib==3.7.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter==1.0.0",
    "notebook==6.5.2",
    "ipython==8.10.0",
    "ipykernel==6.21.2",
    "matplotlib-inline==0.1.6",
]

[dependency-groups]
dev = [
    "jupyter==1.0.0",
    "notebook==6.5.2",
    "ipython==8.10.0",
    "ipykernel==6.21.2",
    "matplotlib-inline==0.1.6",
]
